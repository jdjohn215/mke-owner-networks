name: Update parcel data and networks

on:
  workflow_dispatch:
  schedule:
    - cron:  '0 1 * * 1-5' # Mon-Fri, 1AM UTC / 7PM CST

env:
  GEOCODIO_API_KEY: ${{ secrets.GEOCODIO_API_KEY_SECRET }}
  GITHUB_TOKEN: ${{ secrets.PAT }}
  GITHUB_PAT: ${{ secrets.PAT }}

jobs:
  update-networks:
    runs-on: ubuntu-latest
    # it should take <10 minutes, but reinstalling the cache can take longer
    timeout-minutes: 60

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@a51a8012b0aab7c32ef9d19bf54da93f3254335e # v2.12.0

      # - name: Set up Quarto
      #   uses: quarto-dev/quarto-actions/setup@v2

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@a51a8012b0aab7c32ef9d19bf54da93f3254335e # v2.12.0
        with:
          packages: |
            any::tidyverse
            any::igraph
            any::tidygraph
            any::ggraph
            any::stringi
            any::tidygeocoder
            any::svglite
            any::here
            any::rlist
            any::jsonlite
            any::httr
            any::lubridate

      - name: fetch MPROP
        run: Rscript -e 'source("processing-scripts/fetch-mprop.R")'
      - name: standardize MPROP addresses
        run: Rscript -e 'source("processing-scripts/mprop-standardize-addresses.R")'
      - name: repair MPROP names
        run: Rscript -e 'source("processing-scripts/mprop-repair-owner-names.R")'
      - name: subset WDFI
        run: Rscript -e 'source("processing-scripts/subset-wdfi-in-mprop.R")'
      - name: standardize WDFI address
        run: Rscript -e 'source("processing-scripts/wdfi-standardize-addresses.R")'
      - name: igraph owner networks
        run: Rscript -e 'source("processing-scripts/identify-owner-networks.R")'
      - name: update new graph SVGs
        run: Rscript -e 'source("processing-scripts/update-network-graph-svgs.R")'
      - name: update overall summary stats
        run: Rscript -e 'source("processing-scripts/update-overall-summary-stats.R")'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'
      - name: Install npm dependencies
        run: npm ci
      - name: Optimize SVGs
        run: |
          git diff --diff-filter=d -z --name-only ./images/networks-svg | xargs -0 -n 1 npx svgo --config svgo.config.js

      - name: Commit results
        # Commit all changed files back to the repository
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        with:
          commit_message: Data updates

      - name: push networked mprop
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        run: |
          set -euo pipefail

          DEST_USER="jdjohn215"
          DEST_REPO="mkepropertynetworks-summary"
          TARGET_BRANCH="main"
          TARGET_DIR="data"
          SOURCE_DIR="data/final-output"

          CLONE_DIR=$(mktemp -d)
          git config --global user.email "jdjohn215@gmail.com"
          git config --global user.name "$DEST_USER"

          git clone --single-branch --depth 1 --branch "$TARGET_BRANCH" \
            "https://${DEST_USER}:${API_TOKEN_GITHUB}@github.com/${DEST_USER}/${DEST_REPO}.git" "$CLONE_DIR"

          rm -rf "${CLONE_DIR:?}/${TARGET_DIR}"
          mkdir -p "$CLONE_DIR/$TARGET_DIR"
          cp -ra "$SOURCE_DIR"/. "$CLONE_DIR/$TARGET_DIR"

          cd "$CLONE_DIR"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to push"
          else
            git commit -m "Data updates from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
            git push origin "$TARGET_BRANCH"
          fi
